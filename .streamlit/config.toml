# Kenapa berkas ini ada
# ----------------------
# app.py memaksa tampilan TERANG lewat CSS buatan sendiri (radial-gradient terang,
# kartu putih, teks `--ink: #213547`). Tapi tanpa pengaturan ini Streamlit
# mengikuti tema sistem operasi. Di Windows/GNOME mode gelap, Streamlit memakai
# `textColor: rgb(250,250,250)` di atas latar yang app.py paksa jadi terang --
# hasilnya teks putih di atas putih: label radio, label slider "Jumlah potongan
# sumber (k)", angka min/max slider, dan placeholder semuanya lenyap
# (rasio kontras terukur 1.00-1.02, syarat WCAG 4.5).
#
# `base = "light"` mengunci tema Streamlit tetap terang di OS apa pun, sehingga
# warna teks dan latar yang dipilih app.py selalu saling cocok.

[theme]
base = "light"
primaryColor = "#55B1DF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#213547"
font = "sans serif"
